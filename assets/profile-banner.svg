<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Mukhammaddiyor Ibrokhimov — Full-Stack Web Engineer</title>
  <desc id="description">A navy and cyan banner with Mukhammaddiyor's name, an abstract MI monogram, and the words React interfaces. Thoughtful APIs. Useful products.</desc>
  <defs>
